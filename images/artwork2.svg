<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="abstractBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <rect width="400" height="500" fill="url(#abstractBg)"/>
  
  <!-- Large abstract shapes -->
  <circle cx="80" cy="100" r="60" fill="#FFD700" opacity="0.6"/>
  <circle cx="80" cy="100" r="50" fill="#FFA500" opacity="0.5"/>
  
  <polygon points="300,50 380,150 280,180" fill="#00CED1" opacity="0.5"/>
  <polygon points="300,50 350,120 270,140" fill="#20B2AA" opacity="0.4"/>
  
  <!-- Organic flowing shapes -->
  <path d="M 50 300 Q 100 250 150 300 T 250 300" stroke="#FF1493" stroke-width="8" fill="none" opacity="0.7" filter="url(#blur)"/>
  <path d="M 100 350 Q 150 300 200 350 T 350 350" stroke="#00FF7F" stroke-width="6" fill="none" opacity="0.6" filter="url(#blur)"/>
  <path d="M 30 200 Q 80 150 130 200" stroke="#87CEEB" stroke-width="10" fill="none" opacity="0.5" filter="url(#blur)"/>
  
  <!-- Splatter-like elements -->
  <g opacity="0.7">
    <circle cx="120" cy="150" r="8" fill="#FF6347"/>
    <circle cx="130" cy="140" r="5" fill="#FF6347"/>
    <circle cx="115" cy="160" r="6" fill="#FF6347"/>
  </g>
  
  <g opacity="0.6">
    <circle cx="300" cy="300" r="10" fill="#32CD32"/>
    <circle cx="295" cy="310" r="6" fill="#32CD32"/>
    <circle cx="310" cy="305" r="7" fill="#32CD32"/>
  </g>
  
  <!-- Geometric elements -->
  <rect x="50" y="400" width="80" height="80" fill="#FF4500" opacity="0.4" transform="rotate(45 90 440)"/>
  <rect x="280" y="420" width="70" height="70" fill="#1E90FF" opacity="0.4" transform="rotate(-30 315 455)"/>
  
  <!-- Central focal point - colorful burst -->
  <g>
    <circle cx="200" cy="250" r="40" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="200" cy="250" r="35" fill="#FFB6C1" opacity="0.7"/>
    <!-- Radial lines -->
    <line x1="200" y1="250" x2="200" y2="180" stroke="#FFD700" stroke-width="3"/>
    <line x1="200" y1="250" x2="270" y2="250" stroke="#00CED1" stroke-width="3"/>
    <line x1="200" y1="250" x2="200" y2="320" stroke="#FF69B4" stroke-width="3"/>
    <line x1="200" y1="250" x2="130" y2="250" stroke="#32CD32" stroke-width="3"/>
    <line x1="200" y1="250" x2="260" y2="190" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="200" y1="250" x2="260" y2="310" stroke="#87CEEB" stroke-width="2"/>
    <line x1="200" y1="250" x2="140" y2="310" stroke="#FFA500" stroke-width="2"/>
    <line x1="200" y1="250" x2="140" y2="190" stroke="#FF1493" stroke-width="2"/>
  </g>
  
  <!-- Scattered sparkles -->
  <text x="60" y="80" font-size="20" opacity="0.6">✨</text>
  <text x="350" y="100" font-size="18" opacity="0.5">✨</text>
  <text x="80" y="480" font-size="16" opacity="0.6">✨</text>
  <text x="320" y="460" font-size="20" opacity="0.5">✨</text>
  <text x="200" y="50" font-size="18" opacity="0.4">✨</text>
</svg>