<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Vibrant gradient background -->
  <defs>
    <linearGradient id="vibrantBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="500" fill="url(#vibrantBg)"/>
  
  <!-- Large expressive circles -->
  <circle cx="100" cy="80" r="50" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="100" cy="80" r="45" fill="#FF4500" opacity="0.6"/>
  <circle cx="100" cy="80" r="40" fill="#FFFFFF" opacity="0.4"/>
  
  <circle cx="300" cy="120" r="55" fill="#1E90FF" opacity="0.7"/>
  <circle cx="300" cy="120" r="48" fill="#00BFFF" opacity="0.6"/>
  <circle cx="300" cy="120" r="40" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Diagonal dynamic lines -->
  <g stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="0" y1="150" x2="150" y2="100" stroke="#FFD700"/>
    <line x1="250" y1="200" x2="400" y2="150" stroke="#00FF00"/>
    <line x1="50" y1="350" x2="200" y2="300" stroke="#00CED1"/>
    <line x1="300" y1="400" x2="400" y2="350" stroke="#FF69B4"/>
  </g>
  
  <!-- Overlapping rectangles -->
  <rect x="30" y="250" width="100" height="80" fill="#FF8C00" opacity="0.6" transform="rotate(20 80 290)"/>
  <rect x="270" y="300" width="90" height="70" fill="#32CD32" opacity="0.6" transform="rotate(-25 315 335)"/>
  <rect x="150" y="380" width="100" height="60" fill="#00BFFF" opacity="0.5" transform="rotate(35 200 410)"/>
  
  <!-- Central starburst of energy -->
  <g>
    <circle cx="200" cy="280" r="50" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="200" cy="280" r="45" fill="#FFD700" opacity="0.7"/>
    <!-- Radiating lines -->
    <line x1="200" y1="280" x2="200" y2="200" stroke="#FF1493" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="280" y2="280" stroke="#00FF7F" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="200" y2="360" stroke="#1E90FF" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="120" y2="280" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
    <!-- Diagonal rays -->
    <line x1="200" y1="280" x2="260" y2="220" stroke="#FFB6C1" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="260" y2="340" stroke="#87CEEB" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="140" y2="340" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="280" x2="140" y2="220" stroke="#32CD32" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Colorful dots scattered -->
  <g>
    <circle cx="60" cy="400" r="8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="340" cy="100" r="10" fill="#FF69B4" opacity="0.7"/>
    <circle cx="380" cy="450" r="7" fill="#00FF7F" opacity="0.7"/>
    <circle cx="20" cy="200" r="9" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Energetic swirls -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 50 50 Q 80 30 100 60"/>
    <path d="M 320 450 Q 350 430 380 460"/>
  </g>
  
  <!-- Sparkle elements -->
  <text x="100" y="350" font-size="32" opacity="0.5">💫</text>
  <text x="290" y="200" font-size="28" opacity="0.5">💫</text>
  <text x="50" y="100" font-size="24" opacity="0.4">✨</text>
  <text x="350" y="400" font-size="26" opacity="0.4">✨</text>
</svg>